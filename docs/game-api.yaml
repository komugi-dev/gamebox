asyncapi: 2.6.0
info:
  title: Gamebox Game API
  version: 1.0.0
  description: WebSocket API to stream game events.
servers:
  gamebox:
    url: ws://localhost:8080/gamebox/v1
    protocol: ws

channels:
  /game:
    publish:
      summary: Messages from clients to server
      message:
        oneOf:
          - $ref: '#/components/messages/PlayMessage'
    subscribe:
      summary: Messages received by the clients (unsolicited from server)
      message:
        oneOf:
          - $ref: '#/components/messages/WelcomeMessage'
          - $ref: '#/components/messages/StateMessage'
          - $ref: '#/components/messages/YourTurnMessage'
          - $ref: '#/components/messages/GameOverMessage'
          - $ref: '#/components/messages/ErrorMessage'

components:
  messages:
    WelcomeMessage:
      name: WelcomeMessage
      title: Welcome and identity setup
      summary: First message sent by the server when the WebSocket is successfully opened.
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [welcome]
          player_guid:
            type: string
            description: Unique ID the client will use in every message to the server.
        required:
          - type
          - player_guid

    PlayMessage:
      name: PlayMessage
      title: Player move
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [play]
          player_guid:
            type: string
          turn_id:
            type: string
            description: Unique ID associated with the turn, sent along with the YourTurn message.
          payload:
            type: object
            description: Payload depending on the game logic.
        required:
          - type
          - player_guid
          - turn_id
          - payload

    StateMessage:
      name: StateMessage
      title: Game status
      summary: Sent by the server after each move.
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [state]
          player_guid:
            type: string
            description: The recipient. In case of hidden information, the game logic will filter.
          payload:
            type: object
            description: The game status the recipient can access to.
        required:
          - type
          - player_guid
          - payload

    YourTurnMessage:
      name: YourTurnMessage
      title: Move Request
      summary: The server notifies a client it must play.
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [yourturn]
          player_guid:
            type: string
            description: Unique ID associated with the client.
          payload:
            type: object
            description: Updated game status.
          turn_id:
            type: string
            description: Unique ID associated with the turn.
        required:
          - type
          - player_guid
          - turn_id

    GameOverMessage:
      name: GameOverMessage
      title: Game Over
      summary: Sent by the server when the game ends.
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [gameover]
          player_guid:
            type: string
            description: The recipient.
          winners:
            type: array
            items:
              type: string
            description: List of player GUIDs who won the game. If empty, the game ended in a draw.
          payload:
            type: object
            description: Final game status, including leaderboards or scores depending on game logic.
        required:
          - type
          - player_guid
          - winners
          - payload

    ErrorMessage:
      name: ErrorMessage
      title: Business logic error
      summary: Sent by the server when a client's action is invalid.
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [error]
          payload:
            type: string
            description: A human-readable error message explaining what went wrong.
        required:
          - type
          - payload